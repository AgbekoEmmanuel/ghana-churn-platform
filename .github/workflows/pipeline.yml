name: Live churn pipeline

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

concurrency:
  group: churn-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Add new customers (simulator)
        run: python scripts/simulator.py --max-batches 1 --batch 10

      - name: Score them (scorer)
        run: python scripts/scorer.py --once
